<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="SENAIA-IA">
  <title>SENAIA-IA</title>
  <defs>
    <linearGradient id="senaia-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Badge. Radius 112 matches the iOS/macOS squircle proportion closely enough
       that the generated app icons don't look pinched when the OS masks them. -->
  <rect width="512" height="512" rx="112" fill="url(#senaia-bg)"/>

  <!-- The mark is a relay path, not a letterform traced from a font: two opposed
       arcs reading as an "S" while describing what the gateway does — take a
       message in on one side, hand it out on the other. Stroke-width 52 with
       round caps keeps it solid at 16px, where thin detail turns to mush. -->
  <path d="M 336 178 A 80 80 0 1 0 256 258 A 80 80 0 1 1 176 338"
        fill="none" stroke="#ffffff" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active-agent spark. The one warm note against the cool badge, and the
       detail that stops this reading as a generic blue "S".
       Placed so its edge clears the stroke's upper terminus by ~12px: any
       closer and the two merge into a single blob once rendered at 32px. -->
  <circle cx="386" cy="132" r="30" fill="#fbbf24"/>
</svg>
